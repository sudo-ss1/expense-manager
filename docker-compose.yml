services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: expenses
      POSTGRES_USER: expenses
      POSTGRES_PASSWORD: expenses
    # No host port: only the backend talks to the DB, so a local Postgres on 5432 can't clash.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expenses -d expenses"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/expenses
      DB_USER: expenses
      DB_PASSWORD: expenses
      TZ: Asia/Kolkata   # "today" must match the user's local date (form/CSV reject future dates)
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/api/categories > /dev/null"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy   # UI only comes up once the API answers

volumes:
  pgdata:
