server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 3m;   # above Spring's 2 MB limit, so the API's JSON "file too large" error reaches the UI

    # same-origin API: the browser never talks to the backend directly, so no CORS needed in this setup
    location /api/ {
        proxy_pass http://backend:8080;
        # $http_host keeps the port, so Spring sees Origin and Host as the same origin (else POSTs get 403)
        proxy_set_header Host $http_host;
    }

    location / {
        try_files $uri /index.html;
    }
}
